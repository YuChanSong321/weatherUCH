<!--
  "예측의 스케일" 파비콘 — 이 프로젝트를 위해 직접 만든 것. 외부 소재 없음.

  콘텐츠의 핵심 메시지가 그대로 도형이다: 예측 가능성은 시간 규모에 따라 U자를
  그린다. 곡선의 색은 앱의 3막 액센트를 그대로 따른다 (며칠=파랑 → 수십 년=주황
  → 수만 년=보라). 점 세 개는 사용자가 실제로 서 보는 세 지점이다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="예측의 스케일">
  <title>예측의 스케일</title>
  <defs>
    <linearGradient id="u" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38a9e0" />
      <stop offset="0.5" stop-color="#d99a1f" />
      <stop offset="1" stop-color="#9085e9" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a0f1e" />

  <!-- U자 곡선: 왼쪽(며칠)은 높고, 가운데(2주~몇 달)가 바닥, 오른쪽(수만 년)이 최고 -->
  <path
    d="M12 22 C 18 44, 26 48, 32 48 C 38 48, 46 40, 52 16"
    fill="none"
    stroke="url(#u)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- 사용자가 서 보는 세 지점 -->
  <circle cx="12" cy="22" r="3.4" fill="#38a9e0" />
  <circle cx="32" cy="48" r="3.4" fill="#d99a1f" />
  <circle cx="52" cy="16" r="3.4" fill="#9085e9" />
</svg>
